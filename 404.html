<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · Vilarci Dev</title>
  <!-- With this file present, Cloudflare Pages answers unknown addresses with a real 404
       instead of the home page (which search engines count as a duplicate). -->
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0a0c0b" />
  <link rel="icon" type="image/png" href="https://officialpic.vilarci.in/Icons/web-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Martian+Mono:wdth,wght@75..112.5,700..800&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
      background: #0a0c0b radial-gradient(circle at 1px 1px, #1c2421 1.2px, transparent 1.4px) 0 0 / 24px 24px;
      color: #e6efe9; font: 16px/1.6 'JetBrains Mono', ui-monospace, monospace; text-align: center;
    }
    .code { font: 800 clamp(88px, 22vw, 180px)/1 'Martian Mono', monospace; font-stretch: 85%; letter-spacing: -.04em; color: #3ecf8e; }
    h1 { margin: 12px 0 8px; font-size: 22px; }
    p { margin: 0 auto; max-width: 420px; color: #7f8d86; }
    a.btn {
      display: inline-flex; gap: 10px; margin-top: 28px; padding: 14px 22px; border-radius: 10px;
      background: #3ecf8e; color: #06120b; font-weight: 700; text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Nothing at this address.</h1>
    <p>The page you're looking for isn't here. Everything lives on the home page.</p>
    <a class="btn" href="/">Go to vilarci_dev →</a>
  </main>
</body>
</html>
